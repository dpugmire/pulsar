[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar"
version = "0.1.0"
description = "Trame viewer for ADIOS campaign data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "adios2",
    "contourpy",
    "numpy",
    "pillow",
    "trame",
    "trame-vuetify",
]

[project.optional-dependencies]
schema = [
    "PyYAML",
]
demo = [
    "hpc-campaign>=0.7.1",
    # hpc-campaign 0.7 imports dateutil but does not declare it yet.
    "python-dateutil>=2.9",
]
test = [
    "pytest",
    "pytest-playwright",
]

[project.scripts]
pulsar = "pulsar.app:main"

[tool.setuptools]
py-modules = [
    "application",
    "app",
    "config",
    "controllers",
    "db",
    "ingest_campaign",
    "media_utils",
    "query_parser",
    "sqlite_store",
    "state_init",
    "ui",
]

[tool.setuptools.packages.find]
include = ["pulsar*"]

[tool.setuptools.package-data]
"pulsar.module" = ["serve/*.css", "serve/*.js"]

[tool.pytest.ini_options]
markers = [
    "browser: browser-level Trame/Vue integration test",
]
